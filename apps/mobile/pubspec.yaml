name: faazha_mobile
description: Faazha mobile client for Android
publish_to: 'none'
environment:
  sdk: '>=2.18.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  dio: ^5.2.1
  flutter_riverpod: ^2.3.6
  intl: ^0.18.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  json_serializable: ^6.6.1
  freezed: ^2.3.2
  freezed_annotation: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/
